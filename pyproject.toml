[project]
name = "lexinspect"
version = "0.1.0"
description = "Local Python toolkit for English text analysis — readability, lexical diversity, POS tagging, AWL profiling. CLI-first, JSON-out, designed for AI agents."
readme = "README.md"
authors = [{ name = "Quang Nguyen", email = "quangnd159@gmail.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "textstat>=0.7.4",
    "lexicalrichness>=0.5",
    "spacy>=3.7",
    "rich>=13.7",
]

[project.scripts]
lexinspect = "lexinspect.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
cefr-level = [
    # ModernBERT support landed in transformers 4.48; pin floor accordingly.
    "transformers>=4.48",
    "torch>=2.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = ["src/lexinspect/data/*.json", "src/lexinspect/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
