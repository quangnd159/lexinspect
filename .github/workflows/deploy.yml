name: Deploy Production

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "vercel.json"
      - ".vercelignore"
      - ".python-version"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Identifiers, not credentials — they already live in .vercel/project.json.
      # Only VERCEL_TOKEN is a secret.
      VERCEL_ORG_ID: team_PG6AAoF8oxMLm4JeuUCiycRh
      VERCEL_PROJECT_ID: prj_aIZyHkugjTEwLTBpzI5PLbFvtjqZ
      # The Linux bundle is ~280 MB: spaCy, blis and numpy ship unstripped .so
      # files (macOS wheels are far smaller, so a local build understates it).
      # Over the standard limit the builder falls back to installing packages
      # at cold start, which is broken (missing lexinspect or missing uv).
      # Large functions keep everything vendored. Off-platform builds don't see
      # the project's env vars, so set it here.
      VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"
    steps:
      - uses: actions/checkout@v5

      # `vercel build` shells out to uv for the Python runtime and fails with
      # "uv is required but was not found in PATH" without it.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned. From CLI 64 the Python builder, seeing a bundle over its
      # "standard size", ships no packages and installs dependencies at cold
      # start from PyPI, which leaves out lexinspect itself (a local package):
      # every request failed with ModuleNotFoundError. CLI 53 vendors the full
      # environment. Re-test `vercel build` before raising this.
      - name: Install Vercel CLI
        run: npm install -g vercel@53.0.1

      # Build happens here in CI (not on Vercel) and deploys prebuilt — this
      # keeps Vercel build-compute usage minimal.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The web UI is static: serve it from Vercel's CDN (public/) so a page
      # view never invokes the Python function. The function answers /v1/* only.
      - name: Publish static UI to the CDN
        run: |
          mkdir -p public/static
          cp src/lexinspect/static/*.js src/lexinspect/static/*.css public/static/
          cp src/lexinspect/static/index.html public/index.html
          cp src/lexinspect/static/licences.html public/licences.html

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # The Linux Python bundle is ~280 MB (large functions on). Surface the number
      # so a dependency bump that balloons it is visible.
      - name: Report bundle size
        run: |
          echo "### Vercel build output" >> "$GITHUB_STEP_SUMMARY"
          du -sh .vercel/output 2>/dev/null | awk '{print "total: " $1}' >> "$GITHUB_STEP_SUMMARY"
          du -sh .vercel/output/functions/* 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
