name: Deploy Preview

on:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "vercel.json"
      - ".vercelignore"
      - ".python-version"
      - ".github/workflows/preview.yml"

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Pull requests from forks and Dependabot get no VERCEL_TOKEN, so a preview
    # would only fail. The Quality workflow still checks them.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      # Identifiers, not credentials — they already live in .vercel/project.json.
      # Only VERCEL_TOKEN is a secret.
      VERCEL_ORG_ID: team_PG6AAoF8oxMLm4JeuUCiycRh
      VERCEL_PROJECT_ID: prj_aIZyHkugjTEwLTBpzI5PLbFvtjqZ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `vercel build` shells out to uv for the Python runtime and fails with
      # "uv is required but was not found in PATH" without it.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Pinned. From CLI 64 the Python builder, seeing a bundle over its
      # "standard size", ships no packages and installs dependencies at cold
      # start from PyPI, which leaves out lexinspect itself (a local package):
      # every request failed with ModuleNotFoundError. CLI 53 vendors the full
      # environment. Re-test `vercel build` before raising this.
      - name: Install Vercel CLI
        run: npm install -g vercel@53.0.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # The web UI is static: serve it from Vercel's CDN (public/) so a page
      # view never invokes the Python function. The function answers /v1/* only.
      - name: Publish static UI to the CDN
        run: |
          mkdir -p public/static
          cp src/lexinspect/static/*.js src/lexinspect/static/*.css src/lexinspect/static/*.png public/static/
          cp src/lexinspect/static/index.html public/index.html
          cp src/lexinspect/static/licences.html public/licences.html
          cp src/lexinspect/static/comparison.html public/comparison.html
          cp -R src/lexinspect/static/comparison public/static/comparison

      # The Linux bundle is ~280 MB, over the builder's standard limit, because
      # spaCy, blis and numpy ship .so files with debug symbols. Over the limit
      # the builder ships no packages and installs them at cold start, which is
      # broken (every request failed). So install the environment `vercel build`
      # uses ourselves, strip debug info, and let the build reuse it: uv sees
      # the packages already installed and the bundle maps files from here.
      - name: Pre-install and strip the Python environment
        run: |
          UV_PROJECT_ENVIRONMENT=.vercel/python/.venv uv sync --frozen --no-dev --no-editable
          du -sm .vercel/python/.venv | awk '{print "before strip: " $1 " MB"}'
          find .vercel/python/.venv -name "*.so*" -type f -exec strip --strip-debug {} +
          du -sm .vercel/python/.venv | awk '{print "after strip: " $1 " MB"}'

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
