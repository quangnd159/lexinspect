# Monthly, grouped, so updates arrive as one pull request per ecosystem.
# The Vercel CLI stays pinned in the workflows on purpose (see deploy.yml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
