<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lexinspect</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="container">
  <header>
    <h1>lexinspect</h1>
    <span class="meta" id="version-meta">loading…</span>
  </header>

  <textarea id="text" placeholder="Paste English text here (essay, passage, exam item…) and hit Analyze."></textarea>

  <div class="controls">
    <div class="stat-row">
      <span><b id="liveChars">0</b> chars</span>
      <span><b id="liveWords">0</b> words</span>
    </div>
    <div class="examples">
      <button class="secondary" data-fixture="simple">simple</button>
      <button class="secondary" data-fixture="academic">academic</button>
      <button class="secondary" data-fixture="narrative">narrative</button>
      <button class="secondary" id="clearBtn">clear</button>
      <button id="analyzeBtn">Analyze</button>
    </div>
  </div>

  <div id="status"></div>

  <div class="results" id="results">
    <div class="summary" id="summary"></div>
    <div class="explainer" id="explainer">
      <button class="ex-close" id="exClose" aria-label="Close">×</button>
      <div id="exContent"></div>
    </div>
    <div class="results-body">
      <nav class="sidebar-nav" id="tabs" aria-label="Module navigation"></nav>
      <div class="panels-area" id="panels"></div>
    </div>
  </div>

  <footer>
    <a href="/docs" target="_blank">API docs</a> ·
    <a href="/v1/schema" target="_blank">schema</a> ·
    <a href="/licences">data sources &amp; licences</a> ·
    <a href="https://github.com/quangnd159/lexinspect" target="_blank">repo</a>
  </footer>
</div>

<!--
  Loaded in dependency order: pure data, then DOM helpers, then per-module
  renderers, then the app entry point that wires them together.
-->
<script src="/static/metric-info.js"></script>
<script src="/static/ui-helpers.js"></script>
<script src="/static/renderers.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
